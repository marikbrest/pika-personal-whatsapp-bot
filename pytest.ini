[pytest]
# repo root on sys.path - `src` has no __init__.py (it's a namespace
# package, same as `python -m uvicorn src.main:app` from the repo root
# already relies on), so tests need the root explicitly rather than relying
# on pytest's own rootdir insertion.
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
